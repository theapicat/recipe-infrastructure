networks:
  recipe-net:
    name: recipe-net
    driver: bridge

volumes:
  auth_db_data:
  core_db_data:
  mongo_cache_data:
  rabbitmq_data:
  seq_data:

services:
  # -----------------------------------------------------------------
  # 1. AUTH DATABASE (PostgreSQL)
  # -----------------------------------------------------------------
  recipe-auth-db:
    image: postgres:16-alpine
    container_name: recipe-auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      LANG: C.UTF-8
    ports:
      - "${AUTH_DB_PORT}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./init-scripts/01-init-auth-db.sql:/docker-entrypoint-initdb.d/01-init-auth-db.sql
    networks:
      - recipe-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # 2. CORE DATABASE (PostgreSQL)
  # -----------------------------------------------------------------
  recipe-core-db:
    image: postgres:16-alpine
    container_name: recipe-core-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
      POSTGRES_DB: ${CORE_DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      LANG: C.UTF-8
    ports:
      - "${CORE_DB_PORT}:5432"
    volumes:
      - core_db_data:/var/lib/postgresql/data
      - ./init-scripts/02-init-core-db.sql:/docker-entrypoint-initdb.d/02-init-core-db.sql
    networks:
      - recipe-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CORE_DB_USER} -d ${CORE_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # 3. SCRAPER CACHE (MongoDB)
  # -----------------------------------------------------------------
  recipe-scraper-cache:
    image: mongo:7.0
    container_name: recipe-scraper-cache
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_cache_data:/data/db
    networks:
      - recipe-net

  # -----------------------------------------------------------------
  # 4. MESSAGE BROKER (RabbitMQ med Management Dashboard)
  # -----------------------------------------------------------------
  recipe-message-broker:
    image: rabbitmq:3.13-management-alpine
    container_name: recipe-message-broker
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT}:5672"           # AMQP Protokoll
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # Web Dashboard UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - recipe-net

  # -----------------------------------------------------------------
  # 5. CENTRALIZED LOGGING (Seq Dashboard)
  # -----------------------------------------------------------------
  recipe-seq:
    image: datalust/seq:latest
    container_name: recipe-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "${SEQ_PORT}:80"
    volumes:
      - seq_data:/data
    networks:
      - recipe-net

  # -----------------------------------------------------------------
  # 6. LOCAL EMAIL TESTING (Mailpit Server & Web Dashboard)
  # -----------------------------------------------------------------
  recipe-mailpit:
    image: axllent/mailpit:latest
    container_name: recipe-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP Server Port
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI Innboks Dashboard
    networks:
      - recipe-net